<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ส่งคำเชิญ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&amp;family=Sarabun:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#047C3B}a:hover{color:#035E2D}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #F4F6F5; font-family: Sarabun, sans-serif; color: #0F1F17; display: flex; flex-direction: column">
  <dc-import name="AppBar" title="รับผู้เช่า · ห้อง A-206" sub="คุณพิมพ์ชนก แสงทอง" back="OwnerOnboard.dc.html" hint-size="390px,56px"></dc-import>
  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px">
    <ol aria-label="ขั้นตอน" style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <li style="display: flex; flex-direction: column; gap: 6px"><span style="height: 4px; border-radius: 4px; background: #047C3B"></span><span style="font-size: 12px; font-weight: 700; color: #047C3B">1 ผู้เช่า ✓</span></li>
      <li style="display: flex; flex-direction: column; gap: 6px"><span style="height: 4px; border-radius: 4px; background: #047C3B"></span><span style="font-size: 12px; font-weight: 700; color: #047C3B">2 สัญญา ✓</span></li>
      <li style="display: flex; flex-direction: column; gap: 6px"><span style="height: 4px; border-radius: 4px; background: #047C3B"></span><span style="font-size: 12px; font-weight: 700; color: #047C3B">3 ส่งคำเชิญ</span></li>
    </ol>

    <section style="background: #FFFFFF; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
      <strong style="font-size: 14px">ส่งทาง</strong>
      <label style="display: flex; align-items: center; gap: 10px; font-size: 14px"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #047C3B"><span style="flex: 1">SMS ไปที่ 08x-xxx-5678</span></label>
      <label style="display: flex; align-items: center; gap: 10px; font-size: 14px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #047C3B"><span style="flex: 1">LINE (ผู้เช่ายังไม่ได้เพิ่มเพื่อน)</span></label>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <strong style="font-size: 14px">ตัวอย่างข้อความ</strong>
      <div style="background: #E8ECEA; border-radius: 18px; padding: 14px">
        <div style="background: #FFFFFF; border-radius: 16px 16px 16px 4px; padding: 12px 14px; font-size: 14px; line-height: 1.6">สวัสดีคุณพิมพ์ชนก<br>บ้านสวนรัตนาเชิญคุณผูกห้อง A-206 กับ LINE เพื่อรับบิลและจ่ายค่าเช่าออนไลน์<br><span style="color: #047C3B; font-weight: 700">propflow.app/link?token=•••</span><br><span style="font-size: 12px; color: #4F5F57">ลิงก์ใช้ได้ 7 วัน</span></div>
      </div>
    </section>

    <section style="background: #FFFFFF; border-radius: 16px; padding: 14px; display: flex; align-items: center; gap: 14px">
      <div role="img" aria-label="QR คำเชิญ" style="width: 84px; height: 84px; border-radius: 10px; border: 1px solid #DCE3DF; background: #F0F2F1; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #4F5F57">QR</div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 6px"><strong style="font-size: 14px">อยู่ด้วยกันตอนนี้?</strong><span style="font-size: 13px; color: #4F5F57">ให้ผู้เช่าสแกน QR นี้ด้วยกล้อง LINE</span><button style="align-self: flex-start; height: 32px; padding: 0; border: 0; background: transparent; font-family: Sarabun, sans-serif; font-size: 14px; font-weight: 700; color: #047C3B">คัดลอกลิงก์</button></div>
    </section>
  </div>
  <div style="flex: 0 0 auto; background: #FFFFFF; padding: 12px 16px 24px; border-top: 1px solid #E3E8E5">
    <button style="width: 100%; height: 52px; border: 0; border-radius: 14px; background: #047C3B; color: #FFFFFF; font-family: Sarabun, sans-serif; font-size: 17px; font-weight: 700">ส่งคำเชิญและบันทึก</button>
  </div>
</div>
</x-dc>
