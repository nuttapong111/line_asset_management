<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>อาคารและห้อง</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&amp;family=Sarabun:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#047C3B}a:hover{color:#035E2D}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #F4F6F5; font-family: Sarabun, sans-serif; color: #0F1F17; display: flex; flex-direction: column">
  <dc-import name="AppBar" title="บ้านสวนรัตนา" sub="PromptPay xxx-x-x4521-x" action="แก้ไข" back="OwnerPortfolio.dc.html" hint-size="390px,56px"></dc-import>
  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="background: #FFFFFF; border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column"><span style="font-size: 12px; color: #4F5F57">มีผู้เช่า</span><strong style="font-size: 18px">18</strong></div>
      <div style="background: #FFFFFF; border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column"><span style="font-size: 12px; color: #4F5F57">ว่าง</span><strong style="font-size: 18px">1</strong></div>
      <div style="background: #FFFFFF; border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column"><span style="font-size: 12px; color: #4F5F57">ปิดซ่อม</span><strong style="font-size: 18px">1</strong></div>
    </div>
    <sc-for list="{{floors}}" as="f" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px; font-weight: 700; color: #4F5F57">{{f.name}}</span>
        <div style="background: #FFFFFF; border-radius: 16px; overflow: hidden">
          <sc-for list="{{f.rooms}}" as="r" hint-placeholder-count="4">
            <a href="{{r.href}}" style="padding: 11px 14px; border-bottom: 1px solid #EEF1EF; text-decoration: none; color: #0F1F17; display: flex; align-items: center; gap: 12px">
              <span style="width: 46px; height: 40px; border-radius: 10px; background: {{r.bg}}; color: {{r.fg}}; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{r.no}}</span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><strong style="font-size: 14px">{{r.who}}</strong><span style="font-size: 12px; color: #4F5F57">{{r.sub}}</span></span>
              <span style="font-size: 12px; font-weight: 700; color: {{r.tagc}}">{{r.tag}}</span>
            </a>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>
  <div style="flex: 0 0 auto; background: #FFFFFF; padding: 12px 16px 24px; border-top: 1px solid #E3E8E5; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <a href="OwnerMeter.dc.html" style="height: 50px; border-radius: 14px; border: 1.5px solid #047C3B; color: #047C3B; text-decoration: none; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">จดมิเตอร์ทั้งตึก</a>
    <button style="height: 50px; border: 0; border-radius: 14px; background: #047C3B; color: #FFFFFF; font-family: Sarabun, sans-serif; font-size: 15px; font-weight: 700">+ เพิ่มห้อง</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const S = {
      occ: { bg: '#E7F8EE', fg: '#046A33', tag: '', tagc: '#4F5F57' },
      vac: { bg: '#F0F2F1', fg: '#4A5550', tag: 'รับผู้เช่า', tagc: '#047C3B' },
      mnt: { bg: '#FEF3E2', fg: '#8A4B05', tag: 'ปิดซ่อม', tagc: '#8A4B05' }
    };
    const r = (no, who, sub, s, href) => ({ no, who, sub, ...S[s], href: href || 'OwnerUnit.dc.html' });
    const floors = [
      { name: 'ชั้น 2', rooms: [
        r('203', 'คุณมานพ ใจดี', '฿6,500 · สัญญาหมด 30 พ.ย.', 'occ'),
        r('204', 'คุณวีระ', '฿6,800 · ค้างชำระ 6 วัน', 'occ'),
        r('206', 'ห้องว่าง', '฿6,500 · ว่าง 12 วัน', 'vac', 'OwnerOnboard.dc.html'),
        r('207', 'คุณนภา', '฿6,800 · สัญญาหมด มี.ค. 70', 'occ')
      ] },
      { name: 'ชั้น 3', rooms: [
        r('301', 'คุณสุดา', '฿7,200 · สัญญาหมด ก.ค. 70', 'occ'),
        r('302', 'ปรับปรุงห้องน้ำ', 'คาดว่าเสร็จ 15 พ.ย.', 'mnt'),
        r('303', 'คุณอนันต์', '฿7,200 · สัญญาหมด ม.ค. 70', 'occ')
      ] }
    ];
    return { floors };
  }
}
</script>
</body>
</html>
