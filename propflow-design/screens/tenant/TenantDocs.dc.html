<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ผู้เช่า เอกสาร</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&amp;family=Sarabun:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#047C3B}a:hover{color:#035E2D}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #F4F6F5; font-family: Sarabun, sans-serif; color: #0F1F17; display: flex; flex-direction: column">
  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 0; font-family: Anuphan, sans-serif; font-size: 26px; font-weight: 700">เอกสาร</h1>
    <div role="tablist" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #E8ECEA">
      <button role="tab" aria-selected="true" style="height: 36px; border: 0; border-radius: 9px; background: #FFFFFF; font-family: Sarabun, sans-serif; font-size: 14px; font-weight: 700; color: #0F1F17">ทั้งหมด</button>
      <button role="tab" aria-selected="false" style="height: 36px; border: 0; border-radius: 9px; background: transparent; font-family: Sarabun, sans-serif; font-size: 14px; font-weight: 600; color: #4F5F57">บิล</button>
      <button role="tab" aria-selected="false" style="height: 36px; border: 0; border-radius: 9px; background: transparent; font-family: Sarabun, sans-serif; font-size: 14px; font-weight: 600; color: #4F5F57">ใบเสร็จ</button>
      <button role="tab" aria-selected="false" style="height: 36px; border: 0; border-radius: 9px; background: transparent; font-family: Sarabun, sans-serif; font-size: 14px; font-weight: 600; color: #4F5F57">สัญญา</button>
    </div>

    <a href="TenantContract.dc.html" style="background: #FFFFFF; border-radius: 16px; padding: 14px 16px; text-decoration: none; color: #0F1F17; display: flex; align-items: center; gap: 12px">
      <span style="width: 44px; height: 44px; border-radius: 12px; background: #E7F8EE; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#047C3B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path><path d="M13 7l4 4"></path></svg></span>
      <span style="flex: 1; display: flex; flex-direction: column"><strong style="font-size: 15px">สัญญาเช่า A-203</strong><span style="font-size: 13px; color: #4F5F57">ถึง 30 พ.ย. 69 · ขอต่อสัญญาได้แล้ว</span></span>
      <span style="padding: 4px 10px; border-radius: 999px; background: #FEF3E2; color: #8A4B05; font-size: 12px; font-weight: 700">เหลือ 29 วัน</span>
    </a>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px; font-weight: 700; color: #4F5F57">{{g.month}}</span>
        <div style="background: #FFFFFF; border-radius: 16px; overflow: hidden">
          <sc-for list="{{g.items}}" as="d" hint-placeholder-count="2">
            <a href="{{d.href}}" style="padding: 12px 16px; border-bottom: 1px solid #EEF1EF; text-decoration: none; color: #0F1F17; display: flex; align-items: center; gap: 12px">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4F5F57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{d.icon}}"></path></svg>
              <span style="flex: 1; display: flex; flex-direction: column"><strong style="font-size: 15px">{{d.title}}</strong><span style="font-size: 13px; color: #4F5F57">{{d.sub}}</span></span>
              <span style="padding: 3px 10px; border-radius: 999px; background: {{d.bg}}; color: {{d.fg}}; font-size: 12px; font-weight: 700">{{d.tag}}</span>
            </a>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>
  <dc-import name="TabBar" role="tenant" active="docs" hint-size="390px,82px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const bill = 'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6';
    const rc = 'M6 3h9l4 4v14H6zM9 13l2 2 4-4';
    const T = { due: ['รอชำระ', '#EAF1FE', '#1A4FBF'], rec: ['PDF', '#F0F2F1', '#33403A'] };
    const mk = (title, sub, k, isRc) => ({ title, sub, tag: T[k][0], bg: T[k][1], fg: T[k][2], icon: isRc ? rc : bill, href: isRc ? 'TenantReceipt.dc.html' : 'TenantPay.dc.html' });
    const groups = [
      { month: 'พฤศจิกายน 2569', items: [mk('บิลค่าเช่า พ.ย.', '฿7,300.00 · ครบ 5 พ.ย.', 'due'), mk('บิลค่าน้ำไฟ ต.ค.', '฿872.00 · ครบ 5 พ.ย.', 'due')] },
      { month: 'ตุลาคม 2569', items: [mk('ใบเสร็จ RC-2569-00418', 'ค่าเช่า ต.ค. · ฿7,300.00', 'rec', true), mk('ใบเสร็จ RC-2569-00401', 'ค่าน้ำไฟ ก.ย. · ฿804.00', 'rec', true), mk('ใบเสร็จ RC-2569-00377', 'มัดจำ + ค่าเช่าล่วงหน้า · ฿20,300.00', 'rec', true)] }
    ];
    return { groups };
  }
}
</script>
</body>
</html>
