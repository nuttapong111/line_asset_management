<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>สร้างโพสต์</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&amp;family=Sarabun:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#047C3B}a:hover{color:#035E2D}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #F4F6F5; font-family: Sarabun, sans-serif; color: #0F1F17; display: flex; flex-direction: column">
  <dc-import name="AppBar" title="สร้างโพสต์" back="Community.dc.html" hint-size="390px,56px"></dc-import>
  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 16px">
    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 14px; font-weight: 600; margin-bottom: 8px">ประเภท</legend>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button aria-pressed="false" style="height: 64px; border-radius: 14px; border: 1.5px solid #DCE3DF; background: #FFFFFF; font-family: Sarabun, sans-serif; font-size: 14px; font-weight: 600; color: #4F5F57; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">ประกาศ<span style="font-size: 11px">เฉพาะเจ้าของ</span></button>
        <button aria-pressed="false" style="height: 64px; border-radius: 14px; border: 1.5px solid #DCE3DF; background: #FFFFFF; font-family: Sarabun, sans-serif; font-size: 14px; font-weight: 600; color: #0F1F17">คุยกัน</button>
        <button aria-pressed="true" style="height: 64px; border-radius: 14px; border: 2px solid #047C3B; background: #E7F8EE; font-family: Sarabun, sans-serif; font-size: 14px; font-weight: 700; color: #046A33">ซื้อขาย</button>
      </div>
    </fieldset>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">หัวข้อ
      <input value="ชั้นวางรองเท้า 4 ชั้น" style="height: 48px; box-sizing: border-box; border: 1.5px solid #C9D2CD; border-radius: 10px; padding: 0 14px; font-family: Sarabun, sans-serif; font-size: 16px; background: #FFFFFF">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">ราคา (บาท)
      <input inputmode="numeric" value="200" style="height: 48px; box-sizing: border-box; border: 1.5px solid #C9D2CD; border-radius: 10px; padding: 0 14px; font-family: Anuphan, sans-serif; font-size: 18px; font-weight: 600; background: #FFFFFF">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">รายละเอียด
      <textarea style="height: 96px; box-sizing: border-box; border: 1.5px solid #C9D2CD; border-radius: 10px; padding: 12px 14px; font-family: Sarabun, sans-serif; font-size: 15px; line-height: 1.5; background: #FFFFFF; resize: none">สภาพ 90% นัดรับที่ล็อบบี้ได้</textarea>
    </label>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 14px; font-weight: 600">รูปภาพ <span style="font-weight: 400; color: #4F5F57">(สูงสุด 4 รูป · 2/4)</span></span>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <div style="aspect-ratio: 1; border-radius: 12px; background: #DCE3DF; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #4F5F57">รูป 1</div>
        <div style="aspect-ratio: 1; border-radius: 12px; background: #DCE3DF; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #4F5F57">รูป 2</div>
        <button aria-label="เพิ่มรูป" style="aspect-ratio: 1; border-radius: 12px; border: 1.5px dashed #9AA8A1; background: #FFFFFF; color: #047C3B; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
      </div>
    </div>
  </div>
  <div style="flex: 0 0 auto; background: #FFFFFF; padding: 12px 16px 24px; border-top: 1px solid #E3E8E5">
    <button style="width: 100%; height: 52px; border: 0; border-radius: 14px; background: #047C3B; color: #FFFFFF; font-family: Sarabun, sans-serif; font-size: 17px; font-weight: 700">โพสต์ในบ้านสวนรัตนา</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
