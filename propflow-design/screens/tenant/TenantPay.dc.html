<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const n = 21, cells = [];
    const finder = (x, y) => {
      const f = (ox, oy) => { const dx = x - ox, dy = y - oy; if (dx < 0 || dy < 0 || dx > 6 || dy > 6) return null; return (dx === 0 || dy === 0 || dx === 6 || dy === 6 || (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4)); };
      const r = f(0, 0) ?? f(14, 0) ?? f(0, 14);
      return r;
    };
    let s = 7;
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const fv = finder(x, y);
      s = (s * 1103515245 + 12345) % 2147483648;
      const on = fv === null ? ((s >> 16) & 1) === 1 : fv;
      const nearFinder = fv === null && ((x <= 7 && y <= 7) || (x >= 13 && y <= 7) || (x <= 7 && y >= 13));
      cells.push(on && !nearFinder ? '#0F1F17' : 'transparent');
    }
    return { cells };
  }
}
</script>
