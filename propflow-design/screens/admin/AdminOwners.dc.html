<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>แอดมิน เจ้าของ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&amp;family=Sarabun:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#047C3B}a:hover{color:#035E2D}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #F4F6F5; font-family: Sarabun, sans-serif; color: #0F1F17; display: flex; flex-direction: column; position: relative">
  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 20px 16px 12px; display: flex; flex-direction: column; gap: 12px">
    <h1 style="margin: 0; font-family: Anuphan, sans-serif; font-size: 26px; font-weight: 700">เจ้าของ</h1>
    <label style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid #DCE3DF; background: #FFFFFF">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4F5F57" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input aria-label="ค้นหาเจ้าของ" placeholder="ชื่อ หรือ username" style="flex: 1; min-width: 0; border: 0; outline: 0; font-family: Sarabun, sans-serif; font-size: 15px; background: transparent">
    </label>
    <div style="background: #FFFFFF; border-radius: 16px; overflow: hidden">
      <sc-for list="{{owners}}" as="o" hint-placeholder-count="6">
        <a href="#" style="padding: 12px 14px; border-bottom: 1px solid #EEF1EF; text-decoration: none; color: #0F1F17; display: flex; align-items: center; gap: 12px">
          <span style="width: 40px; height: 40px; border-radius: 50%; background: #F0F2F1; font-weight: 700; display: flex; align-items: center; justify-content: center">{{o.i}}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><strong style="font-size: 15px">{{o.name}}</strong><span style="font-size: 12px; color: #4F5F57">{{o.sub}}</span></span>
          <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px"><span style="padding: 3px 10px; border-radius: 999px; background: {{o.bg}}; color: {{o.fg}}; font-size: 12px; font-weight: 700">{{o.tag}}</span><span style="font-size: 11px; color: #4F5F57">{{o.line}}</span></span>
        </a>
      </sc-for>
    </div>
  </div>
  <button style="position: absolute; right: 16px; bottom: 98px; height: 52px; padding: 0 20px; border: 0; border-radius: 999px; background: #047C3B; color: #FFFFFF; font-family: Sarabun, sans-serif; font-size: 16px; font-weight: 700; box-shadow: 0 6px 16px rgba(4,124,59,0.30)">+ สร้างบัญชีเจ้าของ</button>
  <dc-import name="TabBar" role="admin" active="owners" hint-size="390px,82px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const T = { trial: ['ทดลอง', '#EAF1FE', '#1A4FBF'], act: ['รายเดือน', '#E7F8EE', '#046A33'], yr: ['รายปี', '#E7F8EE', '#046A33'], perm: ['ถาวร', '#F1ECFA', '#5A3496'], grace: ['ผ่อนผัน', '#FEF3E2', '#8A4B05'], sus: ['ระงับ', '#FDECEA', '#A8221A'] };
    const owners = [
      ['ร', 'คุณรัตนา', 'rattana · 2 อาคาร', 'trial', 'ผูก LINE แล้ว'],
      ['ว', 'คุณวรรณา', 'wanna · 3 อาคาร', 'act', 'ผูก LINE แล้ว'],
      ['ป', 'คุณประเสริฐ', 'prasert · 1 อาคาร', 'grace', 'ผูก LINE แล้ว'],
      ['ส', 'คุณสมศักดิ์', 'somsak · 4 อาคาร', 'yr', 'ผูก LINE แล้ว'],
      ['อ', 'คุณอรทัย', 'orathai · 1 อาคาร', 'perm', 'ยังไม่ผูก LINE'],
      ['อ', 'คุณเอกชัย', 'ekachai · 1 อาคาร', 'sus', 'ผูก LINE แล้ว'],
      ['น', 'คุณนิพนธ์', 'nipon · 0 อาคาร', 'trial', 'ยังไม่เข้าใช้ครั้งแรก']
    ].map(([i, name, sub, k, line]) => ({ i, name, sub, line, tag: T[k][0], bg: T[k][1], fg: T[k][2] }));
    return { owners };
  }
}
</script>
</body>
</html>
