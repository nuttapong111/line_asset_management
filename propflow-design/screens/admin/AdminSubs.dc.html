<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>แอดมิน อนุมัติค่าบริการ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&amp;family=Sarabun:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#047C3B}a:hover{color:#035E2D}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #F4F6F5; font-family: Sarabun, sans-serif; color: #0F1F17; display: flex; flex-direction: column">
  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 20px 16px 12px; display: flex; flex-direction: column; gap: 12px">
    <h1 style="margin: 0; font-family: Anuphan, sans-serif; font-size: 26px; font-weight: 700">ค่าบริการ</h1>
    <div role="tablist" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #E8ECEA">
      <button role="tab" aria-selected="true" style="height: 36px; border: 0; border-radius: 9px; background: #FFFFFF; font-family: Sarabun, sans-serif; font-size: 14px; font-weight: 700">รอตรวจ 2</button>
      <button role="tab" aria-selected="false" style="height: 36px; border: 0; border-radius: 9px; background: transparent; font-family: Sarabun, sans-serif; font-size: 14px; font-weight: 600; color: #4F5F57">อนุมัติแล้ว</button>
      <button role="tab" aria-selected="false" style="height: 36px; border: 0; border-radius: 9px; background: transparent; font-family: Sarabun, sans-serif; font-size: 14px; font-weight: 600; color: #4F5F57">ปฏิเสธ</button>
    </div>
    <sc-for list="{{subs}}" as="s" hint-placeholder-count="2">
      <article style="background: #FFFFFF; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; gap: 12px">
          <div role="img" aria-label="รูปสลิป" style="flex: 0 0 72px; height: 100px; border-radius: 10px; background: #F0F2F1; border: 1px solid #DCE3DF; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #4F5F57">สลิป</div>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
            <strong style="font-size: 16px">{{s.name}}</strong>
            <span style="font-size: 13px; color: #4F5F57">{{s.no}} · {{s.plan}}</span>
            <span style="font-size: 13px; color: #4F5F57">ส่ง {{s.at}}</span>
            <span style="align-self: flex-start; padding: 3px 10px; border-radius: 999px; background: {{s.ocrBg}}; color: {{s.ocrFg}}; font-size: 12px; font-weight: 700">{{s.ocr}}</span>
          </div>
          <strong style="font-family: Anuphan, sans-serif; font-size: 18px">{{s.amt}}</strong>
        </div>
        <span style="font-size: 13px; color: #33403A">อนุมัติแล้วจะต่ออายุถึง <strong>{{s.until}}</strong></span>
        <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 8px">
          <button style="height: 44px; border: 0; border-radius: 12px; background: #FDECEA; color: #A8221A; font-family: Sarabun, sans-serif; font-size: 15px; font-weight: 700">ปฏิเสธ</button>
          <button style="height: 44px; border: 0; border-radius: 12px; background: #047C3B; color: #FFFFFF; font-family: Sarabun, sans-serif; font-size: 15px; font-weight: 700">อนุมัติ</button>
        </div>
      </article>
    </sc-for>
  </div>
  <dc-import name="TabBar" role="admin" active="subs" hint-size="390px,82px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const subs = [
      { name: 'คุณประเสริฐ', no: 'SUB-2569-00041', plan: 'รายเดือน', at: 'วันนี้ 06:12', amt: '฿499', until: '1 ธ.ค. 2569', ocr: 'OCR ยอดตรง', ocrBg: '#E7F8EE', ocrFg: '#046A33' },
      { name: 'คุณวรรณา', no: 'SUB-2569-00040', plan: 'รายเดือน', at: 'เมื่อวาน 21:40', amt: '฿499', until: '4 ธ.ค. 2569', ocr: 'อ่านสลิปไม่ได้', ocrBg: '#FEF3E2', ocrFg: '#8A4B05' }
    ];
    return { subs };
  }
}
</script>
</body>
</html>
