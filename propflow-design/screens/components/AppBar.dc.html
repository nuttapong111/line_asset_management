<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>แถบหัวเรื่อง</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&amp;family=Sarabun:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#047C3B}a:hover{color:#035E2D}
</style>
</helmet>
<header style="width: 390px; height: 56px; box-sizing: border-box; background: #FFFFFF; border-bottom: 1px solid #E3E8E5; display: flex; align-items: center; gap: 4px; padding: 0 6px; font-family: Sarabun, sans-serif; color: #0F1F17">
  <a href="{{back}}" aria-label="ย้อนกลับ" style="width: 44px; height: 44px; flex: 0 0 44px; display: flex; align-items: center; justify-content: center; color: #0F1F17"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"></path></svg></a>
  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
    <strong style="font-family: Anuphan, sans-serif; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{title}}</strong>
    <sc-if value="{{hasSub}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #4F5F57">{{sub}}</span></sc-if>
  </div>
  <sc-if value="{{hasAction}}" hint-placeholder-val="{{ false }}"><a href="#" style="padding: 0 10px; font-size: 14px; font-weight: 700">{{action}}</a></sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"หัวเรื่อง"},"sub":{"editor":"text","default":""},"action":{"editor":"text","default":""},"back":{"editor":"text","default":"#"},"$preview":{"width":390,"height":56}}'>
class Component extends DCLogic {
  renderVals() {
    const sub = this.props.sub ?? '';
    const action = this.props.action ?? '';
    return { title: this.props.title ?? 'หัวเรื่อง', back: this.props.back ?? '#', sub, action, hasSub: !!sub, hasAction: !!action };
  }
}
</script>
</body>
</html>
